<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Nilai - SEBEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Styles/Nilai.css">
</head>
<body>
    <aside>
        <div class="sidebar-logo">
            <h3>SEBEL</h3>
        </div>
        <nav>
            <a href="./DashboardForm.html">🏠 <span>Dashboard</span></a>
            <a href="./TabunganSiswa.html">💰 <span>Tabungan</span></a>
            <a href="./NilaiSiswa.html" class="active">📊 <span>Nilai</span></a>
            <a href="./JadwalMengajar.html">📅 <span>Jadwal</span></a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="logout()" class="btn-logout">🚪 <span>Keluar</span></button>
        </div>
    </aside>

    <div id="main-wrapper">
        <main class="container">
            <header>
                <h2>📊 Analisis Nilai Siswa</h2>
            </header>
            
            <form id="form-nilai">
                <div class="form-grid">
                    <div class="field">
                        <label>Kelas</label>
                        <select id="pilih-kelas" onchange="window.updateDaftarSiswaDinamis('pilih-kelas', 'siswa-nama')" required>
                            <option value="" disabled selected>Pilih Kelas</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Nama Siswa</label>
                        <select id="siswa-nama" required>
                            <option value="" disabled selected>Pilih Siswa</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Tugas</label>
                        <select id="tugas-ke" required>
                            <option value="1">Tugas 1</option>
                            <option value="2">Tugas 2</option>
                            <option value="3">Tugas 3</option>
                            <option value="4">Tugas 4</option>
                            <option value="4">Tugas 5</option>
                            <option value="4">Tugas 6</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Nilai</label>
                        <input type="number" id="siswa-nilai" min="0" max="100" placeholder="0-100" required>
                    </div>

                    <div class="field" style="justify-content: flex-end;">
                        <button type="submit" class="btn-primary">Simpan</button>
                    </div>
                </div>
            </form>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nama Siswa</th>
                            <th>Keterangan</th>
                            <th>Nilai</th>
                            <th>Status</th>
                            <th style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="isian-nilai">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { 
            ambilDariServer, simpanKeServer, hapusDiServer, 
            cekAkses, logout, inisialisasiDataMaster, updateDaftarSiswaDinamis 
        } from './script.js';

        // Ekspos ke Global
        window.logout = logout;
        window.updateDaftarSiswaDinamis = updateDaftarSiswaDinamis;
        window.hapusNilai = async (id) => {
            await hapusDiServer('nilai', id, renderTabelNilai);
        };

        document.addEventListener('DOMContentLoaded', async () => {
            cekAkses();
            await inisialisasiDataMaster();
            renderTabelNilai();
        });

        async function renderTabelNilai() {
            const wadah = document.getElementById('isian-nilai');
            if(!wadah) return;

            const data = await ambilDariServer('nilai');
            
            if (!data || data.length === 0) {
                wadah.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: #999;">Belum ada data nilai.</td></tr>';
                return;
            }

            wadah.innerHTML = data.map(item => {
                const isTuntas = item.nilai >= 75;
                return `
                    <tr>
                        <td><strong>${item.nama}</strong></td>
                        <td>Tugas ${item.tugas}</td>
                        <td style="font-weight: 700; color: ${isTuntas ? '#28a745' : '#d93025'};">${item.nilai}</td>
                        <td>
                            <span class="badge" style="background: ${isTuntas ? '#28a745' : '#d93025'};">
                                ${isTuntas ? 'Tuntas' : 'Remedial'}
                            </span>
                        </td>
                        <td style="text-align: center;">
                            <button onclick="hapusNilai('${item.id}')" class="btn-hapus">Hapus</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('form-nilai').addEventListener('submit', async (e) => {
            e.preventDefault();
            const elSiswa = document.getElementById('siswa-nama');
            const payload = {
                nis: elSiswa.value,
                tugas: document.getElementById('tugas-ke').value,
                nilai: parseInt(document.getElementById('siswa-nilai').value)
            };
            
            await simpanKeServer('nilai', payload, () => {
                renderTabelNilai();
                e.target.reset();
            });
        });
    </script>
</body>
</html>
