<link rel="stylesheet" href="Styles/NilaiSiswa.css">
<div class="container">
            <h3><i class="icon">📊</i> Analisis Nilai Siswa</h3>
            <form id="form-nilai" class="form-grid">
                <select id="pilih-kelas-wali" required onchange="updateDaftarSiswa()">
                    <option value="" disabled selected>Pilih Kelas</option>
                    <option value="1-A">1-A</option>
                    <option value="2-B">2-B</option>
                </select>
                <select id="siswa-nama" required>
                    <option value="" disabled selected>Pilih Siswa</option>
                </select>
                <input type="number" id="siswa-nilai" placeholder="Nilai (0-100)" min="0" max="100" required>
                <input type="number" id="tugas-ke" placeholder="Tugas Ke-" required>
                <input type="date" id="tgl-tugas" required>
                <button type="submit" class="btn-primary">Simpan Nilai</button>
            </form>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Siswa</th>
                            <th>Tugas</th>
                            <th>Nilai</th>
                            <th>Status</th>
                            <th>Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="isian-nilai"></tbody>
                </table>
            </div>
        </div>
