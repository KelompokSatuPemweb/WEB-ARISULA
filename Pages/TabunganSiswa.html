<link rel="stylesheet" href="Styles/TabunganSiswa.css">
<div class="container">
            <h3><i class="icon">💰</i> Input Tabungan Siswa</h3>
            <form id="form-tabungan">
                <input type="text" id="nama" placeholder="Nama Siswa" required>
                <input type="date" id="tgl-masuk" required>
                <input type="number" id="nominal" placeholder="Nominal (Rp)" required>
                <button type="submit" class="btn-primary">Simpan Transaksi</button>
            </form>
            <div class="table-container">
                <table id="tabel-siswa">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Total</th>
                            <th>Tgl Masuk</th>
                            <th>Status</th>
                            <th>Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="isian"></tbody>
                </table>
            </div>
        </div>
