<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style-lanjutan.css">
    <title>SEBEL - Sekolah Belajar</title>
</head>
<body>

    <div class="container" id="login-section">
        <h2>Login SEBEL</h2>
        <form id="form-login">
            <div class="input-group">
                <input type="text" id="login-siswa" placeholder="NIS / Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </div>
        </form>
        <p id="user-info">Silakan login</p>
        
        <div id="btn-google" style="display: flex; justify-content: center; margin-top: 15px;"></div>
    </div>

    <div id="main-content" style="display:none;">
        <nav class="navbar">
            <div class="nav-brand">SEBEL Dashboard</div>
            <div class="nav-user">
                <span id="display-user-name">Pengguna</span>
                <button onclick="logout()" class="btn-logout-small">Logout</button>
            </div>
        </nav>

        <div class="container">
            <h3><i class="icon">💰</i> Input Tabungan Siswa</h3>
            <form id="form-tabungan">
                <input type="text" id="nama" placeholder="Nama Siswa" required>
                <input type="date" id="tgl-masuk" required>
                <input type="number" id="nominal" placeholder="Nominal (Rp)" required>
                <button type="submit" class="btn-primary">Simpan Transaksi</button>
            </form>
            <div class="table-container">
                <table id="tabel-siswa">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Total</th>
                            <th>Tgl Masuk</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="isian"></tbody>
                </table>
            </div>
        </div>

        <div class="container">
            <h3><i class="icon">📅</i> Jadwal Mengajar Guru</h3>
            <form id="form-jadwal" class="form-grid">
                <input type="time" id="jam-mulai" required>
                <select id="pilih-hari" required>
                    <option value="" disabled selected>Pilih Hari</option>
                    <option value="Senin">Senin</option>
                    <option value="Selasa">Selasa</option>
                    <option value="Rabu">Rabu</option>
                    <option value="Kamis">Kamis</option>
                    <option value="Jumat">Jumat</option>
                </select>
                <select id="pilih-mapel" required>
                    <option value="" disabled selected>Pilih Mapel</option>
                    <option value="Matematika">Matematika</option>
                    <option value="IPA">IPA</option>
                    <option value="Informatika">Informatika</option>
                </select>
                <select id="pilih-kelas" required>
                    <option value="" disabled selected>Kelas</option>
                    <option value="10-A">10-A</option>
                    <option value="10-B">10-B</option>
                </select>
                <select id="pilih-guru" required>
                    <option value="" disabled selected>Pilih Guru</option>
                    <option value="Pak Budi">Pak Budi, S.Pd</option>
                    <option value="Ibu Siti">Ibu Siti, M.Pd</option>
                </select>
                <button type="submit" class="btn-primary">Tambah Jadwal</button>
            </form>
        </div>

        <div class="container">
            <h3><i class="icon">📊</i> Analisis Nilai Siswa</h3>
            <form id="form-nilai" class="form-grid">
                <select id="pilih-kelas-wali" required onchange="updateDaftarSiswa()">
                    <option value="" disabled selected>Pilih Kelas</option>
                    <option value="1-A">1-A</option>
                    <option value="2-B">2-B</option>
                </select>
                <select id="siswa-nama" required>
                    <option value="" disabled selected>Pilih Siswa</option>
                </select>
                <input type="number" id="siswa-nilai" placeholder="Nilai (0-100)" min="0" max="100" required>
                <input type="number" id="tugas-ke" placeholder="Tugas Ke-" required>
                <input type="date" id="tgl-tugas" required>
                <button type="submit" class="btn-primary">Simpan Nilai</button>
            </form>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Siswa</th>
                            <th>Tugas</th>
                            <th>Nilai</th>
                            <th>Status</th>
                            <th>Hapus</th>
                        </tr>
                    </thead>
                    <tbody id="isian-nilai"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script-lanjutan.js"></script>
</body>
</html>
