<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css">
    <title>SEBEL - Sekolah Belajar</title>
</head>
<body>

    <div class="container" id="login-section">
        <h2>Login SEBEL</h2>
        <form id="form-login">
            <div class="input-group">
                <input type="text" id="login-siswa" placeholder="NIS / Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="btn-login-manual">Login</button>
            </div>
        </form>
        <p id="user-info">Silakan login</p>
        <div id="btn-google"></div>
    </div>

    <div id="main-content" style="display:none;">
        
        <div class="container">
            <h2>Input Tabungan Siswa</h2>
            <form id="form-tabungan">
                <div class="input-group">
                    <input type="text" id="nama" placeholder="Nama Siswa" required>
                    <input type="date" id="tgl-masuk" required>
                    <input type="number" id="nominal" placeholder="Total Pemasukkan (Rp)" required>
                    <button type="submit" id="btn-simpan">Simpan Data</button>
                </div>
            </form>
            <hr>
            <table class="tabel" id="tabel-siswa">
                <thead>
                    <tr class="baris-judul">
                        <th>Nama Siswa</th>
                        <th>Total Pemasukkan</th>
                        <th>Tanggal Masuk</th>
                        <th>Tanggal Keluar</th>
                        <th>Status</th>
                        <th>Hapus</th>
                    </tr>
                </thead>
                <tbody id="isian"></tbody>
            </table>
        </div>

        <div class="container">
            <h2>Input Jadwal Mengajar Guru</h2>
            <form id="form-jadwal">
                <div class="form-grid">
                    <div class="field">
                        <label for="jam-mulai">Waktu Mulai:</label>
                        <input type="time" id="jam-mulai" required>
                    </div>
                    <div class="field">
                        <label for="pilih-hari">Hari:</label>
                        <select id="pilih-hari" required>
                            <option value="" disabled selected>-- Pilih Hari --</option>
                            <option value="Senin">Senin</option>
                            <option value="Selasa">Selasa</option>
                            <option value="Rabu">Rabu</option>
                            <option value="Kamis">Kamis</option>
                            <option value="Jumat">Jumat</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="pilih-mapel">Mata Pelajaran:</label>
                        <select id="pilih-mapel" required>
                            <option value="" disabled selected>-- Pilih Mapel --</option>
                            <option value="Matematika">Matematika</option>
                            <option value="IPA">IPA</option>
                            <option value="Informatika">Informatika</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="pilih-kelas">Kelas:</label>
                        <select id="pilih-kelas" required>
                            <option value="" disabled selected>-- Pilih Kelas --</option>
                            <option value="10-A">Kelas 10-A</option>
                            <option value="10-B">Kelas 10-B</option>
                            <option value="11-A">Kelas 11-A</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="pilih-guru">Guru Pengajar:</label>
                    <select id="pilih-guru" required>
                        <option value="" disabled selected>-- Pilih Guru --</option>
                        <option value="Budi">Pak Budi, S.Pd</option>
                        <option value="Siti">Ibu Siti, M.Pd</option>
                        <option value="Andi">Pak Andi, S.Kom</option>
                    </select>
                </div>
                <button type="submit" id="btn-simpan-jadwal">Tambahkan ke Jadwal</button>
            </form>
        </div>

        <div class="container">
            <h2>Analisis Nilai Siswa (Wali Kelas)</h2>
            <form id="form-nilai">
                <div class="form-grid">
                    <div class="field">
                        <label>Wali Kelas Dari:</label>
                        <select id="pilih-kelas-wali" required onchange="updateDaftarSiswa()">
                            <option value="" disabled selected>-- Pilih Kelas --</option>
                            <option value="1-A">Kelas 1-A</option>
                            <option value="2-B">Kelas 2-B</option>
                            <option value="3-A">Kelas 3-A</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Nama Siswa:</label>
                        <select id="siswa-nama" required>
                            <option value="" disabled selected>-- Pilih Kelas Dulu --</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Mata Pelajaran:</label>
                        <select id="siswa-mapel" required>
                            <option value="Matematika">Matematika</option>
                            <option value="IPA">IPA Terpadu</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Tugas Ke-:</label>
                        <input type="number" id="tugas-ke" placeholder="isi level tugas" min="1" required>
                    </div>
                    <div class="field">
                        <label>Tanggal Kumpul:</label>
                        <input type="date" id="tgl-tugas" required>
                    </div>
                    <div class="field">
                        <label>Nilai:</label>
                        <input type="number" id="siswa-nilai" min="0" max="100" required>
                    </div>
                </div>
                <button type="submit" id="btn-simpan-nilai">Simpan Analisis Nilai</button>
            </form>
            <hr>
            <table class="tabel">
                <thead>
                    <tr class="baris-judul">
                        <th>Siswa (Kelas)</th>
                        <th>Mapel</th>
                        <th>Tugas</th>
                        <th>Tgl Kumpul</th>
                        <th>Nilai</th>
                    </tr>
                </thead>
                <tbody id="isian-nilai"></tbody>
            </table>
        </div>

        <div style="text-align: center; margin-bottom: 50px;">
            <button onclick="logout()" id="btn-logout-main" style="background-color: #ff4d4d; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Logout dari Sistem
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
